name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Unit and functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build, lint, unit tests, and API functional tests
        run: |
          mkdir -p artifacts/verification
          bash scripts/verify.sh 2>&1 | tee artifacts/verification/build-and-tests.log
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Container persistence and browser functional tests
        run: bash scripts/verify-compose.sh 2>&1 | tee artifacts/verification/compose-verification.log
      - name: HTTPS and backup/restore rehearsal
        run: bash scripts/verify-production.sh 2>&1 | tee artifacts/verification/production-verification.log
      - name: 400-client capacity and reconnect integrity
        # Shared runner timing is recorded; the reference-host latency target is measured separately.
        env:
          LOAD_ENFORCE_TARGET: 'false'
        run: bash scripts/verify-load.sh 2>&1 | tee artifacts/verification/load-verification.log
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results
          path: |
            artifacts/verification/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
