name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Unit and functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build, lint, unit tests, and API functional tests
        run: bash scripts/verify.sh
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Container persistence and browser functional tests
        run: bash scripts/verify-compose.sh
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
