services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Admin__Credential: "${MINGLE_ADMIN_CREDENTIAL:-}"
      Admin__SessionMinutes: "${MINGLE_ADMIN_SESSION_MINUTES:-60}"
      Admin__AuditRetentionDays: "${MINGLE_ADMIN_AUDIT_RETENTION_DAYS:-7}"
      Storage__DataDirectory: /data
      Security__AllowInsecureCookies: "true"
    volumes:
      - app-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:${TEAMGAMES_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app-data:
