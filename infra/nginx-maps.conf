log_format mingle '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# Direct HTTP/TLS profiles use their actual scheme. The shared-router profile
# overrides this variable because its public origin is always HTTPS.
map $scheme $mingle_forwarded_proto {
    default $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$status:$uri" $cache_control {
    default "no-store";
    ~^200:/assets/ "public, max-age=31536000, immutable";
    ~^200:/(api|hubs)(/|$) "no-store";
    ~^200: "no-cache";
}
