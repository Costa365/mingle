include /etc/nginx/mingle-maps.conf;
# Unpublished plain HTTP listener for the container health check only.
server {
    listen 8080;
    access_log off;
    error_log /dev/null;
    location = /healthz { default_type text/plain; return 200 'healthy'; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MingleSSL:10m;
    ssl_session_timeout 10m;
    include /etc/nginx/mingle-server.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
