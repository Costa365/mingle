include /etc/nginx/mingle-maps.conf;
server {
    listen 8080;
    # This profile is exclusively for an HTTPS public site behind the router.
    # Never trust a caller-supplied X-Forwarded-Proto or client-IP header.
    set $mingle_forwarded_proto https;
    include /etc/nginx/mingle-server.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
