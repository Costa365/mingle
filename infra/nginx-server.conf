
    access_log /var/log/nginx/access.log mingle;
    # Request error logs can include full URLs/referrers and opaque hub tokens.
    # Sanitized access statuses and the API health/logs provide diagnostics.
    error_log /dev/null;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve after API container recreation instead of retaining its old IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8080;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    location ~ ^/(api|hubs)(/|$) {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        client_max_body_size 64k;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
