# Shared nginx-proxy / Cloudflare deployment. Do not combine with compose.yaml.
# Require HTTPS at Cloudflare; the host listener is loopback-only for diagnostics.
services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Admin__Credential: "${MINGLE_ADMIN_CREDENTIAL:-}"
      Admin__SessionMinutes: "${MINGLE_ADMIN_SESSION_MINUTES:-60}"
      Admin__AuditRetentionDays: "${MINGLE_ADMIN_AUDIT_RETENTION_DAYS:-7}"
      Storage__DataDirectory: /data
      Security__AllowInsecureCookies: "false"
      Security__PublicOrigin: "https://mingle.costa365.site"
      # The API container's readiness probe calls 127.0.0.1, not localhost.
      AllowedHosts: "mingle.costa365.site;localhost;127.0.0.1"
      Proxy__KnownProxy: "${MINGLE_WEB_IP:-172.30.96.3}"
    volumes:
      - app-data:/data
    networks:
      default:
        ipv4_address: "${MINGLE_API_IP:-172.30.96.2}"
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      VIRTUAL_HOST: mingle.costa365.site
      VIRTUAL_PORT: "8080"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./infra/nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: "${MINGLE_WEB_IP:-172.30.96.3}"
      nginx-proxy:
        aliases:
          - mingle-web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app-data:

networks:
  default:
    ipam:
      config:
        - subnet: "${MINGLE_NETWORK_SUBNET:-172.30.96.0/24}"
  nginx-proxy:
    external: true
    name: nginx-proxy
